<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main(~{::div.content-wrapper})}">
<head>
    <title>Создать пользователя</title>
</head>
<body>
    <div class="content-wrapper">
        <div style="max-width: 600px; margin: 0 auto;">
            <a th:href="@{/admin/users}" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem;" onmouseover="this.style.color='var(--text-color)'" onmouseout="this.style.color='var(--text-muted)'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                К списку пользователей
            </a>
            <h1 style="margin: 1rem 0 2rem 0;">Создать нового пользователя</h1>

            <div th:if="${error}" class="card" style="border-left: 4px solid var(--status-overdue); margin-bottom: 1.5rem;">
                <p th:text="${error}" style="color: var(--status-overdue); font-weight: 500;"></p>
            </div>

            <div class="card">
                <form th:action="@{/admin/users}" th:object="${user}" method="post">
                    <div class="form-group">
                        <label for="username">Имя пользователя (логин)</label>
                        <input type="text" id="username" th:field="*{username}" placeholder="Например: ivan_ivanov" required/>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="Введите надежный пароль" required/>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Полное имя (ФИО)</label>
                        <input type="text" id="fullName" th:field="*{fullName}" placeholder="Иванов Иван Иванович" required/>
                    </div>

                    <div class="form-group">
                        <label for="roleId">Роль в системе</label>
                        <select id="roleId" name="roleId" required>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                        </select>
                    </div>

                    <div style="margin-top: 2rem;">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Создать пользователя</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
