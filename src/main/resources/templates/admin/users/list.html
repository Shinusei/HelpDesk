<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: main(~{::div.content-wrapper})}">
<head>
    <title>Управление пользователями</title>
</head>
<body>
    <div class="content-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Управление пользователями</h1>
            <a th:href="@{/admin/users/create}" class="btn btn-primary">+ Создать пользователя</a>
        </div>

        <div th:if="${success}" class="card" style="border-left: 4px solid var(--status-closed); margin-bottom: 1.5rem;">
            <p th:text="${success}" style="color: var(--status-closed); font-weight: 500;"></p>
        </div>
        <div th:if="${error}" class="card" style="border-left: 4px solid var(--status-overdue); margin-bottom: 1.5rem;">
            <p th:text="${error}" style="color: var(--status-overdue); font-weight: 500;"></p>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                        <th>ФИО</th>
                        <th>Роль</th>
                        <th style="text-align: right;">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}" style="color: var(--text-muted); font-size: 0.875rem;"></td>
                        <td>
                            <strong th:text="${u.username}"></strong>
                        </td>
                        <td th:text="${u.fullName}"></td>
                        <td>
                            <span th:text="${u.role.name}" class="status-badge" 
                                  th:style="'background-color: ' + (${u.role.name == 'ROLE_ADMIN'} ? 'rgba(99, 102, 241, 0.1)' : (${u.role.name == 'ROLE_IT_SUPPORT'} ? 'rgba(16, 185, 129, 0.1)' : 'rgba(107, 114, 128, 0.1)')) + '; ' +
                                           'color: ' + (${u.role.name == 'ROLE_ADMIN'} ? 'var(--primary)' : (${u.role.name == 'ROLE_IT_SUPPORT'} ? 'var(--status-closed)' : 'var(--text-muted)'))">
                            </span>
                        </td>
                        <td style="text-align: right;">
                            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.875rem;">Изменить</a>
                                <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" 
                                      onsubmit="return confirm('Вы уверены, что хотите удалить этого пользователя?');"
                                      th:if="${u.username != #authentication.name}">
                                    <button type="submit" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.875rem; color: var(--status-overdue); border-color: rgba(239, 68, 68, 0.2);">Удалить</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
