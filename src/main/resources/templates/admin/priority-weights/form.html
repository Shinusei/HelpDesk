<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Priority Weight Form</title>
</head>
<body>
    <h1 th:text="${weight.id == null} ? 'Create New Priority Weight' : 'Edit Priority Weight'"></h1>
    <form th:action="@{/admin/priority-weights}" th:object="${weight}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div>
            <label for="paramName">Parameter Name:</label>
            <select id="paramName" th:field="*{paramName}" required>
                <option th:each="param : ${priorityParameters}"
                        th:value="${param}"
                        th:text="${param.displayName}"></option>
            </select>
        </div>
        <div>
            <label for="weightValue">Weight Value:</label>
            <input type="number" step="0.1" id="weightValue" th:field="*{weightValue}" required/>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description" th:field="*{description}"></textarea>
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>
    <a th:href="@{/admin/priority-weights}">Back to List</a>
</body>
</html>
