<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Priority Weights</title>
</head>
<body>
    <h1>Priority Weights Management</h1>

    <table>
        <thead>
            <tr>
                <th>Parameter Name</th>
                <th>Weight Value</th>
                <th>Description</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="weight : ${weights}">
                <td th:text="${weight.paramName.displayName}"></td>
                <td th:text="${weight.weightValue}"></td>
                <td th:text="${weight.description}"></td>
                <td th:text="${weight.updatedAt}"></td>
                <td>
                    <a th:href="@{/admin/priority-weights/edit/{id}(id=${weight.id})}">Edit</a>
                </td>
            </tr>
        </tbody>
    </table>

    <hr/>
    <a th:href="@{/}">Back to Home</a>
</body>
</html>
