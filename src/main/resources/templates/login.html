<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | HelpDesk ITSM</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-sidebar);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="color: var(--primary); font-weight: 700; font-size: 1.5rem; margin-bottom: 0.5rem;">HelpDesk ITSM</div>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Please sign in to your account</p>
        </div>
        
        <div th:if="${param.error}" style="color: var(--status-overdue); font-size: 0.875rem; text-align: center; margin-bottom: 1rem;">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" style="color: var(--status-closed); font-size: 0.875rem; text-align: center; margin-bottom: 1rem;">
            You have been signed out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
        </form>
        
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.75rem; text-align: center; color: var(--text-muted);">
            &copy; 2026 HelpDesk ITSM System
        </div>
    </div>
</body>
</html>
