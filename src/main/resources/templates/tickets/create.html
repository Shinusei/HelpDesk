<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main(~{::div.content-wrapper})}">
<head>
    <title>Создать новую заявку</title>
</head>
<body>
    <div class="content-wrapper">
        <div style="max-width: 800px; margin: 0 auto;">
            <a th:href="@{/tickets}" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem;" onmouseover="this.style.color='var(--text-color)'" onmouseout="this.style.color='var(--text-muted)'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                К списку заявок
            </a>
            <h1 style="margin: 1rem 0 2rem 0;">Создать новую заявку</h1>

            <div class="card">
                <form th:action="@{/tickets}" th:object="${ticket}" method="post" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="title">Название заявки</label>
                        <input type="text" id="title" th:field="*{title}" placeholder="Например: Не работает принтер в 302 кабинете" required/>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Подробное описание</label>
                        <textarea id="description" th:field="*{description}" rows="5" placeholder="Пожалуйста, опишите проблему как можно подробнее..." required></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="category">Категория</label>
                            <select id="category" th:field="*{category}" required>
                                <option th:each="val : ${allCategories}" th:value="${val}" th:text="${val.displayName}"></option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="importance">Важность</label>
                            <select id="importance" th:field="*{importance}" required>
                                <option th:each="imp : ${allImportances}" th:value="${imp}" th:text="${imp.displayName}"></option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="urgency">Срочность</label>
                            <select id="urgency" th:field="*{urgency}" required>
                                <option th:each="val : ${allUrgencies}" th:value="${val}" th:text="${val.displayName}"></option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="impact">Влияние</label>
                            <select id="impact" th:field="*{impact}" required>
                                <option th:each="val : ${allImpacts}" th:value="${val}" th:text="${val.displayName}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Прикрепленный файл (необязательно)</label>
                        <div class="dropzone" id="dropzone">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            <div class="dropzone-hint">Перетащите файл сюда или нажмите для выбора</div>
                            <input type="file" name="file" id="fileInput" style="display: none;"/>
                        </div>
                        
                        <div id="previewContainer" class="preview-container" style="display: none; margin-top: 1rem;">
                            <img id="previewImage" class="preview-thumbnail" src="" alt="Preview"/>
                            <div class="preview-info">
                                <div id="previewName" class="preview-name"></div>
                                <div id="previewSize" class="preview-size"></div>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                        <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Создать заявку</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Скрипт должен быть внутри content-wrapper, иначе Thymeleaf его вырежет -->
        <script>
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');
            const previewName = document.getElementById('previewName');
            const previewSize = document.getElementById('previewSize');

            dropzone.addEventListener('click', () => fileInput.click());

            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.add('dragover');
                });
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('dragover');
                });
            });

            dropzone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    handleFiles(files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFiles(e.target.files[0]);
                }
            });

            function handleFiles(file) {
                previewContainer.style.display = 'flex';
                previewName.textContent = file.name;
                previewSize.textContent = (file.size / 1024).toFixed(1) + ' KB';

                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewImage.src = e.target.result;
                        previewImage.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewImage.style.display = 'none';
                }
            }
        </script>
    </div>
    
</body>
</html>
