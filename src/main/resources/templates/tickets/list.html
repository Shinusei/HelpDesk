<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: main(~{::div.content-wrapper})}">
<head>
    <title>Список Заявок</title>
</head>
<body>
    <div class="content-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Управление Заявками</h1>
            <div sec:authorize="hasRole('ROLE_EMPLOYEE')">
                <a th:href="@{/tickets/new}" class="btn btn-primary">+ Новая Заявка</a>
            </div>
            <div sec:authorize="hasAnyRole('ROLE_IT_SUPPORT', 'ROLE_ADMIN')">
                <a th:href="@{/tickets/recommended}" class="btn btn-primary">Рекомендованная Заявка</a>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>
                            <a th:href="@{/tickets(sort='title', dir=${sort == 'title' and dir == 'asc' ? 'desc' : 'asc'})}" 
                               class="sort-link" th:classappend="${sort == 'title'} ? 'sort-active' : ''">
                                Заявка
                                <span th:if="${sort == 'title'}" class="sort-indicator" th:text="${dir == 'asc' ? '▴' : '▾'}"></span>
                                <span th:unless="${sort == 'title'}" class="sort-indicator sort-indicator-inactive">↕</span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/tickets(sort='status', dir=${sort == 'status' and dir == 'asc' ? 'desc' : 'asc'})}" 
                               class="sort-link" th:classappend="${sort == 'status'} ? 'sort-active' : ''">
                                Статус
                                <span th:if="${sort == 'status'}" class="sort-indicator" th:text="${dir == 'asc' ? '▴' : '▾'}"></span>
                                <span th:unless="${sort == 'status'}" class="sort-indicator sort-indicator-inactive">↕</span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/tickets(sort='importance', dir=${sort == 'importance' and dir == 'asc' ? 'desc' : 'asc'})}" 
                               class="sort-link" th:classappend="${sort == 'importance'} ? 'sort-active' : ''">
                                Важность
                                <span th:if="${sort == 'importance'}" class="sort-indicator" th:text="${dir == 'asc' ? '▴' : '▾'}"></span>
                                <span th:unless="${sort == 'importance'}" class="sort-indicator sort-indicator-inactive">↕</span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/tickets(sort='priorityScore', dir=${sort == 'priorityScore' and dir == 'asc' ? 'desc' : 'asc'})}" 
                               class="sort-link" th:classappend="${sort == 'priorityScore'} ? 'sort-active' : ''">
                                Приоритет
                                <span th:if="${sort == 'priorityScore'}" class="sort-indicator" th:text="${dir == 'asc' ? '▴' : '▾'}"></span>
                                <span th:unless="${sort == 'priorityScore'}" class="sort-indicator sort-indicator-inactive">↕</span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/tickets(sort='slaDeadline', dir=${sort == 'slaDeadline' and dir == 'asc' ? 'desc' : 'asc'})}" 
                               class="sort-link" th:classappend="${sort == 'slaDeadline'} ? 'sort-active' : ''">
                                SLA
                                <span th:if="${sort == 'slaDeadline'}" class="sort-indicator" th:text="${dir == 'asc' ? '▴' : '▾'}"></span>
                                <span th:unless="${sort == 'slaDeadline'}" class="sort-indicator sort-indicator-inactive">↕</span>
                            </a>
                        </th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td>
                            <div style="font-weight: 600;" th:text="${ticket.title}"></div>
                            <div style="font-size: 0.875rem; color: var(--text-muted);" th:text="${ticket.category.displayName}"></div>
                        </td>
                        <td>
                            <span class="badge" th:classappend="'badge-status-' + ${ticket.status.name().toLowerCase()}" th:text="${ticket.status.displayName}"></span>
                        </td>
                        <td>
                             <span th:text="${ticket.importance.displayName}"></span>
                        </td>
                        <td>
                            <span style="font-weight: 700; color: var(--primary);" th:text="${ticket.priorityScore}"></span>
                        </td>
                        <td>
                            <span th:text="${ticket.slaDeadline != null ? #temporals.format(ticket.slaDeadline, 'dd.MM HH:mm') : '—'}"></span>
                        </td>
                        <td>
                            <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-outline">Подробнее</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
