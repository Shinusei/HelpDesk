<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Tickets</title>
</head>
<body>
    <h1>Tickets</h1>

    <div sec:authorize="hasRole('ROLE_EMPLOYEE')">
        <a th:href="@{/tickets/new}">Create New Ticket</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Priority Score</th> <!-- ДОБАВЛЕНО -->
                <th>Creator</th>
                <th>Executor</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}"></td>
                <td th:text="${ticket.title}"></td>
                <td th:text="${ticket.status}"></td>
                <td th:text="${ticket.priorityScore}"></td> <!-- ДОБАВЛЕНО -->
                <td th:text="${ticket.creator.fullName}"></td>
                <td th:text="${ticket.executor != null ? ticket.executor.fullName : 'N/A'}"></td>
                <td th:text="${ticket.createdAt}"></td>
                <td>
                    <a th:href="@{/tickets/{id}(id=${ticket.id})}">View</a>
                </td>
            </tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
