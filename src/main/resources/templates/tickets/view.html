<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>View Ticket</title>
</head>
<body>
    <h1>Ticket Details</h1>
    <div>
        <strong>ID:</strong> <span th:text="${ticket.id}"></span>
    </div>
    <div>
        <strong>Title:</strong> <span th:text="${ticket.title}"></span>
    </div>
    <div>
        <strong>Description:</strong> <span th:text="${ticket.description}"></span>
    </div>
    <div>
        <strong>Status:</strong> <span th:text="${ticket.status}"></span>
    </div>
    <div>
        <strong>Importance:</strong> <span th:text="${ticket.importance.displayName}"></span>
    </div>
    <div>
        <strong>Priority Score:</strong> <span th:text="${ticket.priorityScore}"></span>
    </div>
    <div>
        <strong>Creator:</strong> <span th:text="${ticket.creator.fullName}"></span>
    </div>
    <div>
        <strong>Executor:</strong> <span th:text="${ticket.executor != null ? ticket.executor.fullName : 'Not Assigned'}"></span>
    </div>
    <div>
        <strong>Created At:</strong> <span th:text="${ticket.createdAt}"></span>
    </div>

    <div sec:authorize="hasAnyRole('ROLE_IT_SUPPORT', 'ROLE_ADMIN')">
        <hr/>
        <h3>Update Status</h3>
        <form th:action="@{/tickets/{id}/update-status(id=${ticket.id})}" method="post">
            <select name="status">
                <option th:each="stat : ${allStatuses}"
                        th:value="${stat}"
                        th:text="${stat}"
                        th:selected="${stat == ticket.status}"></option>
            </select>
            <button type="submit">Update Status</button>
        </form>

        <hr/>
        <h3>Assignment</h3>

        <div sec:authorize="hasRole('ROLE_IT_SUPPORT')">
            <div th:if="${ticket.executor == null}">
                <form th:action="@{/tickets/{id}/assign-to-me(id=${ticket.id})}" method="post">
                    <button type="submit">Assign to me</button>
                </form>
            </div>
            <div th:if="${ticket.executor != null and ticket.executor.username == #authentication.name}">
                <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}" method="post">
                    <input type="hidden" name="executorId" value=""/>
                    <button type="submit">Unassign from me</button>
                </form>
            </div>
        </div>

        <div sec:authorize="hasRole('ROLE_ADMIN')">
            <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}" method="post">
                <select name="executorId">
                    <option value="">-- Unassign --</option>
                    <option th:each="exec : ${executors}"
                            th:value="${exec.id}"
                            th:text="${exec.fullName}"
                            th:selected="${ticket.executor != null and exec.id == ticket.executor.id}"></option>
                </select>
                <button type="submit">Update Assignment</button>
            </form>
        </div>
    </div>

    <hr/>
    <a th:href="@{/tickets}">Back to List</a>
</body>
</html>
