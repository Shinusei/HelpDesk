<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="main(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'HelpDesk'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                Служба Поддержки
            </div>
            
            <nav>
                <ul class="nav-links">
                    <li class="nav-item">
                        <a th:href="@{/tickets}" class="nav-link">
                            Список Заявок
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_IT_SUPPORT', 'ROLE_ADMIN')">
                        <a th:href="@{/dashboard}" class="nav-link">
                            Аналитика
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ROLE_EMPLOYEE')">
                        <a th:href="@{/tickets/new}" class="nav-link">
                            Новая Заявка
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div style="margin-top: auto; padding-top: 2rem;">
                <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">
                    Вы вошли как: <span th:text="${#authentication.name}"></span>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline" style="width: 100%;">Выйти</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div th:replace="${content}"></div>
        </main>
    </div>
</body>
</html>
