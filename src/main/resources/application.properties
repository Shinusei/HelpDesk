spring.application.name=HelpDesk
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk?sslmode=disable
spring.datasource.username=helpdesk
spring.datasource.password=helpdesk
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.thymeleaf.cache=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
