services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/helpdesk?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=helpdesk
      - SPRING_DATASOURCE_PASSWORD=helpdesk
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=helpdesk
      - POSTGRES_PASSWORD=helpdesk
      - POSTGRES_DB=helpdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
